name: Release

# Releases (ADR 0086). Once CI passes on main, semantic-release reads the conventional
# commits since the last tag, decides the version, tags it and opens a draft GitHub release
# with the notes. Each platform then builds its installer on a machine of its own (the
# caches of ADR 0083 can only be made there), attaches it, and the release is published.
#
# A pull request that touches packaging builds the same installers as workflow artifacts,
# without releasing anything: it is the only place Windows and macOS packaging gets run.
#
# Run by hand with a `tag`, it finishes a release that is still a draft: the tag's code is
# built with this workflow, the installers are attached and the release is published. That
# is how a release survives a packaging fix made after its tag.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  pull_request:
    paths:
      - .github/workflows/release.yml
      - .releaserc.json
      - apps/game/electron-builder.yml
      - apps/game/runtimes.lock.json
      - apps/game/packaging/**
      - apps/game/src/main/**
      - scripts/fetch-runtimes.mjs
  workflow_dispatch:
    inputs:
      tag:
        description: Existing draft release to build and publish (e.g. v1.0.0); empty builds artifacts only
        required: false
        default: ''

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  version:
    name: version (semantic-release)
    if: github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write
    outputs:
      version: ${{ steps.release.outputs.version }}
      tag: ${{ steps.release.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          # The commit CI passed on, with the whole history: the version comes from it.
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - id: release
        name: semantic-release
        run: npx semantic-release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # What the installers are built for: the version semantic-release just made, the draft
  # release named by hand, or nothing (a pull request: artifacts only).
  target:
    name: release target
    needs: version
    if: always()
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.pick.outputs.tag }}
      version: ${{ steps.pick.outputs.version }}
    steps:
      - id: pick
        shell: bash
        run: |
          tag="${{ needs.version.outputs.tag }}"
          if [ -z "$tag" ] && [ "${{ github.event_name }}" = workflow_dispatch ]; then
            tag="${{ inputs.tag }}"
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version=${tag#v}" >> "$GITHUB_OUTPUT"

  installers:
    name: installer (${{ matrix.target }})
    needs: target
    # On main, only when semantic-release made a version; on a pull request or by hand, always.
    if: >-
      always() &&
      (github.event_name != 'workflow_run' || needs.target.outputs.tag != '')
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: linux-x64
            os: ubuntu-22.04
            flags: --linux --x64
          - target: win-x64
            os: windows-latest
            flags: --win --x64
          - target: mac-arm64
            os: macos-15
            flags: --mac --arm64
          - target: mac-x64
            os: macos-15-intel
            flags: --mac --x64
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.target.outputs.tag || github.sha }}

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      # ElixirLS is fetched with git while it is compiled (ADR 0083), and some of its test
      # files go past Windows' 260-character path limit.
      - name: Long paths in git
        if: runner.os == 'Windows'
        run: git config --system core.longpaths true

      - name: App version
        if: needs.target.outputs.version != ''
        run: npm version ${{ needs.target.outputs.version }} --no-git-tag-version -w @unifor-quest/game

      - name: Cache the runtime downloads
        uses: actions/cache@v4
        with:
          path: apps/game/runtimes/.downloads
          key: runtimes-${{ matrix.target }}-${{ hashFiles('apps/game/runtimes.lock.json') }}

      - name: Runtimes, checksummed, and warm caches
        run: node scripts/fetch-runtimes.mjs --target ${{ matrix.target }}

      - name: Installer
        shell: bash
        run: |
          # macOS allows few open files per process by default, and packaging the runtimes
          # (thousands of files, Erlang's .beam alone) went past it: EMFILE on arm64.
          if [ "$RUNNER_OS" = macOS ]; then
            ulimit -n 65536 2>/dev/null || ulimit -n "$(ulimit -Hn)"
            echo "open files: $(ulimit -n)"
          fi
          npm run package -- ${{ matrix.flags }} --publish never
        env:
          # No signing identity to look for (ADR 0084): macOS signs ad hoc.
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'

      - uses: actions/upload-artifact@v4
        with:
          name: unifor-quest-${{ matrix.target }}
          path: |
            apps/game/release/*.AppImage
            apps/game/release/*.exe
            apps/game/release/*.dmg
          if-no-files-found: error
          retention-days: 7

      - name: Attach to the release
        if: needs.target.outputs.tag != ''
        shell: bash
        run: |
          shopt -s nullglob
          gh release upload "${{ needs.target.outputs.tag }}" apps/game/release/*.{AppImage,exe,dmg} --clobber --repo "${{ github.repository }}"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  publish:
    name: publish the release
    needs: [target, installers]
    if: always() && needs.target.outputs.tag != '' && needs.installers.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - run: gh release edit "${{ needs.target.outputs.tag }}" --draft=false --latest --repo "${{ github.repository }}"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
