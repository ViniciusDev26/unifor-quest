name: CI

on:
  push:
    branches: [main]
  pull_request:

# A new push to the same branch cancels the run that is already going.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Everything that does not need a toolchain, on one machine. Fast, and the first thing to
  # tell someone their change is wrong.
  check:
    name: lint, tipos e documentacao
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - run: npm ci

      - name: Biome (lint e formatacao)
        run: npm run lint

      - name: TypeScript
        run: npm run typecheck

      - name: Links da documentacao
        run: npm run check:docs

      - name: Indice de ADRs
        run: npm run check:adrs

  # The real thing: every language, on every platform the game supports (ADR 0025).
  #
  # Windows is not decoration here. Killing a process tree, naming a binary `.exe` and
  # keeping the work directory out of the roaming profile are all Windows-only code paths
  # that nothing else exercises.
  test:
    name: testes (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - uses: actions/setup-go@v5
        with:
          go-version: '1.27'

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'

      - uses: erlef/setup-beam@v1
        with:
          otp-version: '29.1.1'
          elixir-version: '1.20.4'

      - run: npm ci

      - name: Os templates compilam na propria linguagem
        run: npm run check:templates

      - name: Os arquivos gerados estao em dia
        run: npm run check:generated

      - name: Testes, com todas as linguagens obrigatorias
        run: npm test
        env:
          # A toolchain that failed to install would otherwise be skipped in silence, and
          # the build would stay green with half the coverage.
          CONFORMANCE_REQUIRE_ALL: '1'

      - name: Build
        run: npm run build
