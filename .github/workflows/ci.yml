name: CI

on:
  push:
    branches: [main]
  pull_request:

# A new push to the same branch cancels the run that is already going.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Everything that does not need a toolchain, on one machine. Fast, and the first thing to
  # tell someone their change is wrong.
  check:
    name: lint, types and docs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - name: Biome (lint and formatting)
        run: npm run lint

      - name: TypeScript
        run: npm run typecheck

      - name: Documentation links
        run: npm run check:docs

      - name: ADR index
        run: npm run check:adrs

      - name: Generated maps are up to date
        run: npm run check:maps

  # The real thing: every language, on every platform the game supports (ADR 0025).
  #
  # Windows is not decoration here. Killing a process tree, naming a binary `.exe` and
  # keeping the work directory out of the roaming profile are all Windows-only code paths
  # that nothing else exercises.
  test:
    name: tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - uses: actions/setup-go@v5
        with:
          go-version: '1.27'

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'

      - uses: erlef/setup-beam@v1
        with:
          otp-version: '29.1.1'
          elixir-version: '1.20.4'

      - run: npm ci

      - name: Templates compile in their own language
        run: npm run check:templates

      - name: Generated files are up to date
        run: npm run check:generated

      - name: Tests, with every language required
        run: npm test
        env:
          # A toolchain that failed to install would otherwise be skipped in silence, and
          # the build would stay green with half the coverage.
          CONFORMANCE_REQUIRE_ALL: '1'

      - name: Build
        run: npm run build

  # Publishes docs/storyboard/ to GitHub Pages -- only on a push to main, and only after the
  # rest of CI passed. The images are real Git LFS objects (not pointers), so the checkout
  # asks for lfs: true; otherwise Pages would serve pointer text instead of PNGs.
  deploy-storyboard:
    name: storyboard on GitHub Pages
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [check, test]
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs/storyboard

      - id: deployment
        uses: actions/deploy-pages@v4
